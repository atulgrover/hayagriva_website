<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accredited Directory Roster | Agentic Professionals Network</title>
  <meta name="description"
    content="Accredited Directory Roster of Insolvency Professionals, Registered Valuers, and Corporate Restructuring Advocates across NCLT benches in India with interactive Leaflet map.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/leaflet-custom.css">
</head>

<body>

  <!-- Shared Site Header -->
  <div id="shared-header"></div>

  <!-- Main Directory Application Layout -->
  <main class="directory-container" style="height: calc(100vh - var(--header-height, 65px));">

    <!-- Directory Left Sidebar -->
    <aside class="directory-sidebar">

      <!-- Search Header -->
      <div class="directory-search-header">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
          <h1 style="font-size: 1.05rem; font-weight: 700; color: #0f172a; margin: 0; display: inline-flex; align-items: center; gap: 0.45rem;">
            <i class="fa-solid fa-address-book" style="color: #2563eb;"></i>
            <span>Accredited Directory</span>
          </h1>
          <span class="badge badge-primary" id="results-count-badge">Loading...</span>
        </div>

        <div class="search-input-group">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="dir-search-input" class="search-input"
            placeholder="Search by name, firm, reg no...">
        </div>

        <div class="filter-row">
          <select id="dir-city-filter" class="filter-select" aria-label="Filter by NCLT City Bench">
            <option value="all">All NCLT Cities</option>
            <option value="Chandigarh">Chandigarh Bench</option>
            <option value="New Delhi">New Delhi (Principal)</option>
            <option value="Mumbai">Mumbai Bench</option>
            <option value="Bengaluru">Bengaluru Bench</option>
            <option value="Ahmedabad">Ahmedabad Bench</option>
            <option value="Kolkata">Kolkata Bench</option>
            <option value="Chennai">Chennai Bench</option>
            <option value="Hyderabad">Hyderabad Bench</option>
          </select>

          <select id="dir-category-filter" class="filter-select" aria-label="Filter by Professional Category">
            <option value="all">All Professionals</option>
            <option value="ip">Insolvency Professionals (IP)</option>
            <option value="rv">Registered Valuers (RV)</option>
            <option value="counsel">Restructuring Advocates</option>
          </select>
        </div>

        <div style="margin-top: 0.75rem;">
          <button type="button" class="btn btn-primary" onclick="openAddMeModal();" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.6rem 1rem; font-size: 0.85rem; font-weight: 600; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer;">
            <i class="fa-solid fa-user-plus"></i> Add Me to Directory
          </button>
        </div>
      </div>

      <!-- Dynamic Cards List -->
      <div class="directory-results-list" id="directory-results-container">
        <!-- Populated dynamically by directory.js -->
      </div>

    </aside>

    <!-- Directory Right Leaflet Map -->
    <div class="directory-map-container" style="flex: 1; height: 100%;">
      <div id="leaflet-map" style="width: 100%; height: 100%;"></div>
    </div>

  </main>

  <!-- JavaScript Libraries & Scripts -->
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Logic -->
  <script src="js/data.js"></script>
  <script src="js/directory.js"></script>
  <script src="js/header.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initDirectory === 'function') {
        initDirectory();
      }
    });
  </script>

</body>
</html>
