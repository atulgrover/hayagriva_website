<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Community Directory | Agentic Professionals Network</title>
  <meta name="description"
    content="Community Directory of Insolvency Professionals, Registered Valuers, and Corporate Restructuring Advocates across NCLT benches in India with interactive Leaflet map.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- Custom Stylesheets -->
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/leaflet-custom.css">
</head>

<body>

  <!-- Shared Site Header -->
  <div id="shared-header"></div>

  <!-- Main Directory Application Layout: Full Width & Viewport Edge-to-Edge -->
  <main class="directory-container" id="directory-app" style="display: flex !important; flex-direction: row !important; width: 100vw !important; max-width: 100% !important; height: calc(100vh - 65px) !important; margin: 0 !important; border: none !important; border-radius: 0 !important; overflow: hidden !important; background: #ffffff; box-sizing: border-box; position: relative;">

    <!-- Directory Left Sidebar -->
    <aside class="directory-sidebar" id="directory-sidebar" style="width: 440px !important; min-width: 440px !important; max-width: 440px !important; flex-shrink: 0 !important; display: flex !important; flex-direction: column !important; border-right: 1px solid #e2e8f0; background: #ffffff; height: 100%; box-sizing: border-box; z-index: 10; position: relative; transition: margin-left 0.28s cubic-bezier(0.16, 1, 0.3, 1);">

      <!-- Search Header -->
      <div class="directory-search-header" style="padding: 1.25rem; border-bottom: 1px solid #e2e8f0; background: #ffffff; flex-shrink: 0;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem;">
          <div>
            <h1 style="font-size: 1.05rem; font-weight: 800; color: #0f172a; margin: 0; display: inline-flex; align-items: center; gap: 0.45rem; letter-spacing: -0.01em;">
              <i class="fa-solid fa-address-book" style="color: #0284c7;"></i>
              <span>COMMUNITY DIRECTORY</span>
            </h1>
            <div style="font-size: 0.72rem; color: #64748b; margin-top: 2px;">
              National Bench Map &bull; <span id="results-count-badge" style="color: #0284c7; font-weight: 600;">Loading...</span>
            </div>
          </div>
        </div>

        <div class="search-input-group" style="margin-bottom: 0.75rem;">
          <i class="fa-solid fa-magnifying-glass search-icon"></i>
          <input type="text" id="dir-search-input" class="search-input"
            placeholder="Search by name, firm, reg no..." style="width: 100%; box-sizing: border-box;">
        </div>

        <div class="filter-row" style="display: flex; gap: 0.5rem;">
          <select id="dir-city-filter" class="filter-select" aria-label="Filter by NCLT City Bench" style="flex: 1; box-sizing: border-box;">
            <option value="all">All NCLT Benches</option>
            <option value="Chandigarh">Chandigarh Bench</option>
            <option value="New Delhi">New Delhi (Principal)</option>
            <option value="Mumbai">Mumbai Bench</option>
            <option value="Bengaluru">Bengaluru Bench</option>
            <option value="Ahmedabad">Ahmedabad Bench</option>
            <option value="Kolkata">Kolkata Bench</option>
            <option value="Chennai">Chennai Bench</option>
            <option value="Hyderabad">Hyderabad Bench</option>
            <option value="Jaipur">Jaipur Bench</option>
            <option value="Cuttack">Cuttack Bench</option>
            <option value="Kochi">Kochi Bench</option>
            <option value="Indore">Indore Bench</option>
            <option value="Guwahati">Guwahati Bench</option>
            <option value="Allahabad">Allahabad Bench</option>
          </select>

          <select id="dir-category-filter" class="filter-select" aria-label="Filter by Professional Category" style="flex: 1; box-sizing: border-box;">
            <option value="all">All Roles</option>
            <option value="ip">Insolvency Professionals (IP)</option>
            <option value="rv">Registered Valuers (RV)</option>
            <option value="counsel">Restructuring Advocates</option>
          </select>
        </div>

        <!-- In-Sidebar Primary Join / Claim Button -->
        <div style="margin-top: 0.75rem;">
          <button type="button" class="btn btn-primary" onclick="openAddMeModal();" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.65rem 1rem; font-size: 0.85rem; font-weight: 700; border-radius: 6px; box-shadow: 0 1px 3px rgba(2,132,199,0.25); cursor: pointer; background: #0284c7; color: #ffffff; border: none;">
            <i class="fa-solid fa-user-plus"></i> + Add My Chamber to Map
          </button>
        </div>
      </div>

      <!-- Dynamic Cards List -->
      <div class="directory-results-list" id="directory-results-container" style="flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem;">
        <!-- Populated dynamically by directory.js -->
      </div>

    </aside>

    <!-- Sidebar Edge Toggle Tab -->
    <button type="button" class="sidebar-edge-toggle" id="sidebar-edge-toggle" onclick="toggleDirectorySidebar()" title="Toggle Directory Roster" aria-label="Toggle Directory Roster">
      <i class="fa-solid fa-chevron-left" id="sidebar-toggle-icon"></i>
    </button>

    <!-- Floating Expand Pill (Visible when collapsed) -->
    <button type="button" class="floating-roster-pill" id="floating-roster-pill" onclick="toggleDirectorySidebar()" aria-label="Expand Directory Roster">
      <i class="fa-solid fa-address-book" style="color: #0284c7;"></i>
      <span style="font-weight: 700; color: #0f172a;">Show Directory</span>
      <span id="floating-count-badge" style="font-size: 0.725rem; font-weight: 600; color: #0284c7; background: #e0f2fe; padding: 2px 8px; border-radius: 9999px;">Loading...</span>
      <i class="fa-solid fa-chevron-right" style="font-size: 0.65rem; color: #64748b;"></i>
    </button>

    <!-- Directory Right Leaflet Map -->
    <div class="directory-map-container" style="flex: 1 1 0% !important; min-width: 450px !important; width: 100% !important; height: 100% !important; position: relative !important; background: #f8fafc !important;">
      <div id="leaflet-map" style="position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; z-index: 1 !important;"></div>
    </div>

  </main>

  <!-- Shared Footer -->
  <div id="shared-footer"></div>

  <!-- JavaScript Libraries & Scripts -->
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Application Logic -->
  <script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/directory.js"></script>
  <script src="js/header.js"></script>
  <script src="js/footer.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof initDirectory === 'function') {
        initDirectory();
      }
    });
  </script>
</body>
</html>
