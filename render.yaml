services:
  # ============================================================================
  # AgenticProfessionals.Net - Institutional Restructuring Operating System
  # Render Static Site Deployment Blueprint
  # Primary Domain: agenticprofessionals.net (or .com / .in)
  # ============================================================================
  - type: web
    name: agentic-professionals
    env: static
    rootDir: .
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /context
        destination: /index.html
      - type: rewrite
        source: /knowledge
        destination: /knowledge.html
      - type: rewrite
        source: /intelligence
        destination: /intelligence.html
      - type: rewrite
        source: /counsels
        destination: /counsels.html
      - type: rewrite
        source: /agents
        destination: /counsels.html
      - type: rewrite
        source: /cocounsel
        destination: /counsels.html
      - type: rewrite
        source: /co-counsel
        destination: /counsels.html
      - type: rewrite
        source: /directory
        destination: /directory.html
      - type: rewrite
        source: /community
        destination: /directory.html
      - type: rewrite
        source: /workbench
        destination: /intelligence.html
      - type: rewrite
        source: /directories
        destination: /directory.html
      - type: rewrite
        source: /vaults
        destination: /knowledge.html
      - type: rewrite
        source: /pricing
        destination: /pricing.html
      - type: rewrite
        source: /docs/*
        destination: /docs/*
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
